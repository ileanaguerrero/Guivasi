<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuidadora+ · Simulated Alexa+ for Spanish-speaking caregivers</title>
  <meta name="description" content="A simulated Alexa+ voice assistant that helps Spanish-speaking home health caregivers with meds, vitals, visit notes, English shift reports and family updates.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230b2540'/><path d='M32 48s-14-8.5-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10.5-14 19-14 19z' fill='%2300caff'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#composer-input">Saltar al chat / Skip to chat</a>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0b2540"/><path d="M32 48s-14-8.5-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10.5-14 19-14 19z" fill="#00caff"/></svg>
      <div>
        <h1>Cuidadora<span class="plus">+</span></h1>
        <p class="tag">Simulated Alexa+ · asistente para cuidadoras</p>
      </div>
    </div>
    <nav class="patients" id="patient-tabs" aria-label="Pacientes / Patients"></nav>
    <div class="top-right">
      <span class="clock" id="clock" aria-label="Hora / Time"></span>
      <button class="ghost" id="reset-btn" title="Borrar datos del demo / Reset demo data">↺ Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="voice" aria-label="Alexa+ conversación / conversation">
      <div class="voice-head">
        <span class="badge">alexa+ <em>simulated</em></span>
        <div class="toggles">
          <button class="pill" id="lang-btn" aria-pressed="false" title="Idioma del micrófono / Mic language">🎙️ Español</button>
          <button class="pill" id="mute-btn" aria-pressed="false" title="Voz / Voice">🔊 Voz</button>
        </div>
      </div>
      <ol class="chat" id="chat" aria-live="polite"></ol>
      <div class="lightbar" id="lightbar" aria-hidden="true"><span></span></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="mic" id="mic-btn" aria-label="Hablar / Speak">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg>
        </button>
        <label class="sr" for="composer-input">Escriba o hable / Type or speak</label>
        <input id="composer-input" type="text" placeholder="Diga «Alexa…» o escriba aquí / Type here">
        <button type="submit" class="send">Enviar</button>
      </form>
      <div class="samples" id="samples" aria-label="Ejemplos / Try these"></div>
    </section>

    <section class="screen" aria-label="Pantalla / Screen">
      <nav class="cardtabs" id="card-tabs" aria-label="Tarjetas / Cards"></nav>
      <div class="stage" id="stage" tabindex="-1"></div>
      <details class="trace" id="trace" open>
        <summary>Agent trace <span>plan → tools → reply</span></summary>
        <ol id="trace-list"></ol>
      </details>
    </section>
  </main>

  <footer class="foot">
    Demo only · fictional patients · not medical advice · <span lang="en">Solo demostración · no es consejo médico</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/nlu.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/llm-adapter.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
